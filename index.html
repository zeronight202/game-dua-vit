<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siêu Vịt Tranh Hùng 2026 - Đấu Trường Tốc Độ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        h1 {
            color: #ff4500;
            text-shadow: 2px 2px #ffe4c4;
            margin-bottom: 10px;
        }

        #race-track {
            width: 100%;
            max-width: 900px;
            background-color: #e0f7fa;
            border: 4px solid #00838f;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
        }

        .lane {
            height: 70px;
            border-bottom: 2px dashed #b2ebf2;
            position: relative;
            box-sizing: border-box;
            transition: background-color 0.2s ease;
            width: 100%;
        }

        .lane:last-child {
            border-bottom: none;
        }

        .lane.leading {
            background-color: #fff59d !important; 
        }

        .duck {
            position: absolute;
            left: 10px;
            top: 2px;
            transition: left 0.05s linear;
            cursor: pointer;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5;
        }

        @keyframes waddle {
            0% { transform: scaleX(-1) rotate(-8deg); }
            50% { transform: scaleX(-1) rotate(8deg); }
            100% { transform: scaleX(-1) rotate(-8deg); }
        }

        .duck.running .duck-avatar {
            animation: waddle 0.2s infinite ease-in-out;
        }

        .duck-avatar {
            font-size: 32px;
            line-height: 1;
            transform: scaleX(-1); 
            display: inline-block; 
        }

        .duck-name {
            font-size: 11px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            white-space: nowrap;
            margin-top: 1px;
        }

        .finish-line-marker {
            position: absolute;
            right: 80px;
            top: 0;
            bottom: 0;
            width: 15px;
            background-image: linear-gradient(45deg, #000 25%, transparent 25%),
                              linear-gradient(-45deg, #000 25%, transparent 25%),
                              linear-gradient(45deg, transparent 75%, #000 75%),
                              linear-gradient(-45deg, transparent 75%, #000 75%);
            background-size: 10px 10px;
            background-position: 0 0, 0 5px, 5px -5px, -5px 0px;
            background-color: #fff;
            z-index: 2;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        input {
            width: 500px;
            max-width: 90vw;
            padding: 12px;
            border-radius: 25px;
            border: 2px solid #00838f;
            text-align: center;
            font-size: 15px;
            outline: none;
        }

        button {
            padding: 14px 35px;
            font-size: 18px;
            font-weight: bold;
            background-color: #ff5722;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px #e64a19;
            transition: all 0.1s ease;
        }

        button:active {
            box-shadow: 0 1px #e64a19;
            transform: translateY(4px);
        }

        button:disabled {
            background-color: #bdbdbd;
            box-shadow: 0 5px #9e9e9e;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h1>🦆 GIẢI ĐUA VỊT NGOẠI HẠNG QUACK-RACING 🦆</h1>

    <div id="race-track">
        <div class="lane" id="lane-1"><div class="finish-line-marker"></div><div class="duck" id="duck-1" style="left: 10px;"><div class="duck-avatar">🦆</div><span class="duck-name">🔴 Vịt Số 1</span></div></div>
        <div class="lane" id="lane-2"><div class="finish-line-marker"></div><div class="duck" id="duck-2" style="left: 10px;"><div class="duck-avatar">🦆</div><span class="duck-name">🟡 Vịt Số 2</span></div></div>
        <div class="lane" id="lane-3"><div class="finish-line-marker"></div><div class="duck" id="duck-3" style="left: 10px;"><div class="duck-avatar">🦆</div><span class="duck-name">🟢 Vịt Số 3</span></div></div>
        <div class="lane" id="lane-4"><div class="finish-line-marker"></div><div class="duck" id="duck-4" style="left: 10px;"><div class="duck-avatar">🦆</div><span class="duck-name">🔵 Vịt Số 4</span></div></div>
        <div class="lane" id="lane-5"><div class="finish-line-marker"></div><div class="duck" id="duck-5" style="left: 10px;"><div class="duck-avatar">🦆</div><span class="duck-name">🟣 Vịt Số 5</span></div></div>
        <div class="lane" id="lane-6"><div class="finish-line-marker"></div><div class="duck" id="duck-6" style="left: 10px;"><div class="duck-avatar">🦆</div><span class="duck-name">🟠 Vịt Số 6</span></div></div>
        <div class="lane" id="lane-7"><div class="finish-line-marker"></div><div class="duck" id="duck-7" style="left: 10px;"><div class="duck-avatar">🦆</div><span class="duck-name">🟤 Vịt Số 7</span></div></div>
        <div class="lane" id="lane-8"><div class="finish-line-marker"></div><div class="duck" id="duck-8" style="left: 10px;"><div class="duck-avatar">🦆</div><span class="duck-name">⚪ Vịt Số 8</span></div></div>
    </div>

    <div class="controls">
        <input type="text" id="names-input" placeholder="Nhập tên người chơi, cách nhau bằng dấu phẩy (tối đa 8 người)">
        <button id="start-btn">BẮT ĐẦU ĐUA!</button>
    </div>

<script>
    // Loại bỏ biến positions lỗi, tích hợp vị trí thẳng vào mảng ducks
    const ducks = [
        { id: 1, name: "Vịt Số 1", color: "🔴", position: 10 },
        { id: 2, name: "Vịt Số 2", color: "🟡", position: 10 },
        { id: 3, name: "Vịt Số 3", color: "🟢", position: 10 },
        { id: 4, name: "Vịt Số 4", color: "🔵", position: 10 },
        { id: 5, name: "Vịt Số 5", color: "🟣", position: 10 },
        { id: 6, name: "Vịt Số 6", color: "🟠", position: 10 },
        { id: 7, name: "Vịt Số 7", color: "🟤", position: 10 },
        { id: 8, name: "Vịt Số 8", color: "⚪", position: 10 }
    ];

    let raceInterval = null;
    let synthInterval = null;
    let isRacing = false;
    let startTime = null;

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let mainGainNode = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new AudioContext();
            mainGainNode = audioCtx.createGain();
            mainGainNode.gain.setValueAtTime(0.2, audioCtx.currentTime); 
            mainGainNode.connect(audioCtx.destination);
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSynthTrack(freq, duration) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square'; 
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(mainGainNode);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    function startBackgroundMusic() {
        let notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
        let step = 0;
        synthInterval = setInterval(() => {
            playSynthTrack(notes[step % notes.length], 0.15);
            step++;
        }, 200);
    }

    function playGrandVictory() {
        const melody = [
            {f: 523.25, d: 0.15}, {f: 523.25, d: 0.15}, {f: 523.25, d: 0.15}, 
            {f: 523.25, d: 0.4}, {f: 415.30, d: 0.4}, {f: 466.16, d: 0.4}, 
            {f: 523.25, d: 0.8}
        ];
        melody.forEach((note, index) => {
            setTimeout(() => {
                playSynthTrack(note.f, note.d);
            }, index * 180);
        });
    }

    document.getElementById("start-btn").addEventListener("click", function() {
        if (isRacing) return;
        
        try {
            initAudio();
        } catch(e) {
            console.log("Chờ tương tác");
        }

        const inputNames = document.getElementById("names-input").value;
        const namesArray = inputNames.trim() !== "" ? inputNames.split(",").map(name => name.trim()).filter(name => name !== "") : [];
        
        ducks.forEach((duck, i) => {
            duck.position = 10; // Reset vị trí gốc sạch sẽ
            if (namesArray[i]) {
                duck.name = namesArray[i];
            } else {
                duck.name = `Vịt Số ${i + 1}`;
            }
            
            const duckEl = document.getElementById(`duck-${duck.id}`);
            if (duckEl) {
                duckEl.style.left = "10px";
                duckEl.classList.add("running");
                duckEl.querySelector(".duck-name").innerHTML = `${duck.color} ${duck.name}`;
            }
            const laneEl = document.getElementById(`lane-${duck.id}`);
            if (laneEl) laneEl.classList.remove("leading");
        });

        isRacing = true;
        this.disabled = true;
startTime = performance.now();
startBackgroundMusic();
const trackWidth = document.getElementById("race-track").clientWidth;
const finishLinePosition = trackWidth - 140;
raceInterval = setInterval(() => {
let winner = null;
let maxPosition = -1;
let leaderId = null;
ducks.forEach((duck) => {
// Di chuyển vị trí ngẫu nhiên
duck.position += Math.floor(Math.random() * 8) + 2;
const duckEl = document.getElementById(duck-${duck.id});
if (duckEl) {
duckEl.style.left = duck.position + "px";
}
if (duck.position > maxPosition) {
maxPosition = duck.position;
leaderId = duck.id;
}
if (duck.position >= finishLinePosition && !winner) {
winner = duck;
}
});
ducks.forEach(duck => {
const laneEl = document.getElementById(lane-${duck.id});
if (laneEl) {
if (duck.id === leaderId) {
laneEl.classList.add("leading");
} else {
laneEl.classList.remove("leading");
}
}
});
if (winner) {
clearInterval(raceInterval);
clearInterval(synthInterval);
isRacing = false;
document.getElementById("start-btn").disabled = false;
ducks.forEach(duck => {
const duckEl = document.getElementById(duck-${duck.id});
if (duckEl) duckEl.classList.remove("running");
});
const endTime = performance.now();
const totalTime = ((endTime - startTime) / 1000).toFixed(2);
playGrandVictory();
setTimeout(() => {
alert(🏆 CHIẾN THẮNG 🏆\n\nChúc mừng [${winner.color} ${winner.name}] đã xuất sắc cán đích đầu tiên!\n⏱️ Thời gian kỷ lục: ${totalTime} giây.);
}, 100);
}
}, 50);
});
