<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIẢI ĐUA VỊT NGOẠI HẠNG QUACK-RACING</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e0f7fa; 
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        h2 {
            color: #0288d1; 
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            font-size: 20px;
            letter-spacing: 2px;
        }

        #race-track {
            background-color: #0288d1; 
            border: 4px solid #01579b;
            border-radius: 10px;
            padding: 10px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .lane {
            height: 75px; 
            border-bottom: 2px dashed #e0f7fa; 
            position: relative;
            background-color: #4fc3f7; 
            width: 100%;
        }

        .lane:last-child {
            border-bottom: none;
        }

        .duck {
            position: absolute;
            left: 10px;
            top: 5px; 
            cursor: pointer;
            user-select: none;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .duck-avatar {
            font-size: 30px;
            display: inline-block;
            transform: scaleX(-1); 
        }

        .duck-name {
            font-size: 11px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 1px 6px;
            border-radius: 4px;
            white-space: nowrap;
            margin-top: 2px;
        }

        .finish-line-marker {
            position: absolute;
            right: 80px;
            top: 0;
            bottom: 0;
            width: 15px;
            background-image: linear-gradient(45deg, #000 25%, transparent 25%),
                              linear-gradient(-45deg, #000 25%, transparent 25%),
                              linear-gradient(45deg, transparent 75%, #000 75%),
                              linear-gradient(-45deg, transparent 75%, #000 75%);
            background-size: 10px 10px;
            background-position: 0 0, 0 5px, 5px -5px, -5px 0px;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
            z-index: 2;
        }

        .controls {
            margin-top: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 25px;
            border: 2px solid #0288d1;
            font-size: 14px;
            outline: none;
            text-align: center;
            margin-bottom: 15px;
        }

        button {
            padding: 12px 35px;
            background-color: #ff5722;
            color: white;
            border: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            text-transform: uppercase;
        }

        #victory-modal {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        #btn-close-modal {
            background: #0288d1;
            color: white;
            border: none;
            padding: 10px 30px;
            font-size: 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h2>💥 GIẢI ĐUA VỊT NGOẠI HẠNG QUACK-RACING 💥</h2>

    <div id="race-track">
        <div class="lane" id="lane-1"><div class="finish-line-marker"></div><div class="duck" id="duck-1"><span class="duck-avatar">🦆🟡</span><span class="duck-name" id="name-1">Vịt Số 1</span></div></div>
        <div class="lane" id="lane-2"><div class="finish-line-marker"></div><div class="duck" id="duck-2"><span class="duck-avatar">🦆🟢</span><span class="duck-name">Vịt Số 2</span></div></div>
        <div class="lane" id="lane-3"><div class="finish-line-marker"></div><div class="duck" id="duck-3"><span class="duck-avatar">🦆🔵</span><span class="duck-name">Vịt Số 3</span></div></div>
        <div class="lane" id="lane-4"><div class="finish-line-marker"></div><div class="duck" id="duck-4"><span class="duck-avatar">🦆🔴</span><span class="duck-name">Vịt Số 4</span></div></div>
        <div class="lane" id="lane-5"><div class="finish-line-marker"></div><div class="duck" id="duck-5"><span class="duck-avatar">🦆🟣</span><span class="duck-name">Vịt Số 5</span></div></div>
        <div class="lane" id="lane-6"><div class="finish-line-marker"></div><div class="duck" id="duck-6"><span class="duck-avatar">🦆🟠</span><span class="duck-name">Vịt Số 6</span></div></div>
        <div class="lane" id="lane-7"><div class="finish-line-marker"></div><div class="duck" id="duck-7"><span class="duck-avatar">🦆🟤</span><span class="duck-name">Vịt Số 7</span></div></div>
        <div class="lane" id="lane-8"><div class="finish-line-marker"></div><div class="duck" id="duck-8"><span class="duck-avatar">🦆⚫</span><span class="duck-name">Vịt Số 8</span></div></div>
    </div>

    <div class="controls">
        <input type="text" id="names-input" placeholder="Nhập tên người chơi, cách nhau bằng dấu phẩy">
        <button id="btn-start">Bắt đầu đua!</button>
    </div>

    <div id="victory-modal">
        <div class="modal-content">
            <h2 style="color: #ff5722; font-size: 26px; margin: 0;">🏆 CHIẾN THẮNG 🏆</h2>
            <p id="modal-message" style="font-size: 18px; font-weight: bold; margin: 20px 0; color: #333;"></p>
            <button id="btn-close-modal">Đua tiếp</button>
        </div>
    </div>

    <script>
        let positions = { "1": 10, "2": 10, "3": 10, "4": 10, "5": 10, "6": 10, "7": 10, "8": 10 };
        let raceInterval = null;
        let soundInterval = null;
        let isRacing = false;
        let audioCtx = null;

        // Hàm phát âm thanh Beep bíp 8-bit bằng thuật toán hệ thống
        function playBeep(frequency, duration) {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'square'; // Sóng vuông tạo âm thanh game retro cổ điển
                oscillator.frequency.value = frequency; 
                gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime); // Âm lượng nhỏ nhẹ dịu tai (5%)

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + duration);
            } catch(e) {
                console.log("Trình duyệt chưa cho phép tương tác âm thanh");
            }
        }

        document.getElementById('btn-start').addEventListener("click", function() {
            if (isRacing) return;

            const inputNames = document.getElementById('names-input').value;
            const namesArray = inputNames.split(',')
                .map(name => name.trim())
                .filter(name => name !== "");

            for (let i = 1; i <= 8; i++) {
                positions[i] = 10;
                
                const duckEl = document.getElementById(`duck-${i}`);
                if (duckEl) duckEl.style.left = '10px';

                const nameEl = document.getElementById(`name-${i}`);
                if (nameEl) {
                    nameEl.innerText = namesArray[i - 1] || `Vịt Số ${i}`;
                }
            }

            isRacing = true;
            this.disabled = true;

            // Phát chuỗi âm thanh đếm nhịp game liên tục khi bầy vịt chạy đua
            soundInterval = setInterval(() => {
                playBeep(300, 0.05);
            }, 300);

            const trackContainer = document.getElementById('race-track');
            const trackWidth = trackContainer.clientWidth || 900;
            const finishLinePosition = trackWidth - 140; 

            raceInterval = setInterval(() => {
                let winnerId = null;

                for (let i = 1; i <= 8; i++) {
                    positions[i] += Math.floor(Math.random() * 6) + 2; 
                    
                    const duckEl = document.getElementById(`duck-${i}`);
                    if (duckEl) {
                        duckEl.style.left = positions[i] + "px";
                    }

                    if (positions[i] >= finishLinePosition && !winnerId) {
                        winnerId = i;
                    }
                }

                if (winnerId) {
                    clearInterval(raceInterval);
                    clearInterval(soundInterval); // Tắt âm thanh chạy đua
                    isRacing = false;
                    document.getElementById('btn-start').disabled = false;

                    // Phát tiếng chuông reo chiến thắng vui tươi dài hơi hơn
playBeep(600, 0.2);
setTimeout(() => playBeep(800, 0.3), 150);
const currentNameEl = document.getElementById(name-${winnerId});
let winnerName = currentNameEl ? currentNameEl.innerText : Vịt Số ${winnerId};
setTimeout(() => {
const modal = document.getElementById('victory-modal');
document.getElementById('modal-message').innerText = Chúc mừng [ ${winnerName} ] đã giành chiến thắng!;
modal.style.display = 'flex';
}, 50);
}
}, 40);
});
document.getElementById('btn-close-modal').addEventListener('click', function() {
document.getElementById('victory-modal').style.display = 'none';
for (let i = 1; i <= 8; i++) {
const duckEl = document.getElementById(duck-${i});
if (duckEl) duckEl.style.left = '10px';
positions[i] = 10;
}
});
